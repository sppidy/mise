name: Bug report
description: Report reproducible behavior in the web app, server, or Android app.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private recipe text, account names, tokens, and server addresses before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web app
        - Server or Docker
        - Android app
        - Recipe import or parsing
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: Tell us what you did, what input you used, and where the failure appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit or version, browser or Android version, and deployment method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only the smallest useful excerpt and redact private data.
