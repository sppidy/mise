name: Android release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
      - name: Validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$EVENT_NAME" == "release" && "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Release tag must match package version v${package_version}" >&2
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
      - name: Restore signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mise-release.p12"
          chmod 600 "$RUNNER_TEMP/mise-release.p12"
      - name: Test and build signed release
        working-directory: android
        env:
          MISE_KEYSTORE_PATH: ${{ runner.temp }}/mise-release.p12
          MISE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MISE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MISE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MISE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
        run: ./gradlew clean lintRelease testDebugUnitTest assembleRelease bundleRelease --no-daemon
      - name: Verify and package artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --verbose --print-certs "$apk"
          bundle_verification="$(jarsigner -verify "$aab" 2>&1)"
          grep -q '^jar verified\.$' <<< "$bundle_verification"
          install -d artifacts
          install -m 644 "$apk" "artifacts/mise-${RELEASE_VERSION}.apk"
          install -m 644 "$aab" "artifacts/mise-${RELEASE_VERSION}.aab"
          cd artifacts
          sha256sum "mise-${RELEASE_VERSION}.apk" "mise-${RELEASE_VERSION}.aab" > SHA256SUMS
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mise-android-${{ steps.version.outputs.version }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Attach artifacts to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber
